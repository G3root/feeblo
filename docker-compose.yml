services:
  pg:
    image: pgvector/pgvector:pg17
    container_name: feeblo-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feeblo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-feeblo}
    # No host port: the app reaches Postgres over the compose network. Add a
    # `127.0.0.1:${POSTGRES_PORT:-5432}:5432` mapping in an override for local
    # admin access; never publish it on every interface.
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-feeblo} -d ${POSTGRES_DB:-feeblo}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: feeblo-redis
    # No host port: only the compose network needs the cache.
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    container_name: feeblo-server
    image: ghcr.io/g3root/feeblo-server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-dev}
    restart: always
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The operator configuration for a self-hosted deployment. It is the same
    # file passed to `--env-file`, so every value in it reaches the container
    # and the ${...} defaults below agree with it. Optional so a compose file
    # used only for CI (which passes values through `environment`) still
    # parses. See docs/self-hosting.md.
    env_file:
      - path: ./docker/.env.selfhost
        required: false
    environment:
      NODE_ENV: production
      APP_RELEASE: ${APP_RELEASE:-dev}
      # The published ports below are the defaults; these origins must match
      # them (or the public proxy origin) or the browser calls the wrong host.
      APP_URL: ${APP_URL:-http://localhost:4321}
      API_URL: ${API_URL:-http://localhost:8080}
      APP_ROOT_DOMAIN: ${APP_ROOT_DOMAIN:-localhost}
      # Browser origins allowed to call the API (better-auth trustedOrigins).
      # Public board subdomains require a wildcard for their root domain.
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-${APP_URL:-http://localhost:4321},${API_URL:-http://localhost:8080},*.${APP_ROOT_DOMAIN:-localhost}}
      DATABASE_URL: ${DATABASE_URL:-postgres://feeblo:password@pg:5432/feeblo}
      # REQUIRED: at-rest encryption key for auth and integration secrets.
      # Compose fails fast instead of silently starting with a known key.
      # Generate one with: openssl rand -hex 32
      AUTH_ENCRYPTION_KEY: "${AUTH_ENCRYPTION_KEY:?AUTH_ENCRYPTION_KEY is required - generate one with: openssl rand -hex 32}"
      # Shared rate-limiter store. REQUIRED in production: startup fails
      # without it so rate limits are never silently per-instance.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Client-IP trust for the reverse proxy. Without either value every
      # request looks like it came from the proxy, so anonymous rate limits
      # share one bucket. Prefer TRUSTED_PROXY_IPS when the proxy is on a
      # known network; TRUST_PROXY_HEADERS trusts every hop and must only be
      # used when the API port is not directly reachable.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      # Optional SES feedback webhook: leave unset to keep the route inert (404).
      EMAIL_PROVIDER_WEBHOOK_TOKEN: ${EMAIL_PROVIDER_WEBHOOK_TOKEN:-}
      EMAIL_PROVIDER_SNS_TOPIC_ARN: ${EMAIL_PROVIDER_SNS_TOPIC_ARN:-}
      # Transactional email (password reset, verification, invitations,
      # notifications). Account creation requires a working mailer unless
      # AUTH_EMAIL_VERIFICATION_REQUIRED is turned off. Values come from the
      # operator file (docker/.env.selfhost); see docs/self-hosting.md.
      # Unset, the server defaults SMTP_HOST to the container loopback
      # (127.0.0.1:2500), where no SMTP server listens, and every send fails.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_UNSAFE_IGNORE_TLS: ${SMTP_UNSAFE_IGNORE_TLS:-}
      SMTP_SERVICE: ${SMTP_SERVICE:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SMTP_PERSONAL_FROM_ADDRESS: ${SMTP_PERSONAL_FROM_ADDRESS:-}
      SMTP_PERSONAL_FROM_NAME: ${SMTP_PERSONAL_FROM_NAME:-}
      SMTP_REPLY_TO_ADDRESS: ${SMTP_REPLY_TO_ADDRESS:-}
      # REQUIRED: S3-compatible object storage. The production stack runs no
      # MinIO, so these must point at real storage and compose fails fast
      # instead of defaulting to the dev stack's credentials or region. See
      # docs/r2-production-checklist.md.
      MEDIA_UPLOAD_REGION: "${MEDIA_UPLOAD_REGION:?MEDIA_UPLOAD_REGION is required - use auto for Cloudflare R2}"
      MEDIA_UPLOAD_ENDPOINT: "${MEDIA_UPLOAD_ENDPOINT:?MEDIA_UPLOAD_ENDPOINT is required - e.g. https://<account_id>.r2.cloudflarestorage.com}"
      MEDIA_UPLOAD_ACCESS_KEY_ID: "${MEDIA_UPLOAD_ACCESS_KEY_ID:?MEDIA_UPLOAD_ACCESS_KEY_ID is required - an access key scoped to the media bucket}"
      MEDIA_UPLOAD_SECRET_ACCESS_KEY: "${MEDIA_UPLOAD_SECRET_ACCESS_KEY:?MEDIA_UPLOAD_SECRET_ACCESS_KEY is required}"
      MEDIA_PUBLIC_BUCKET_NAME: ${MEDIA_PUBLIC_BUCKET_NAME:-feeblo-media-public}
      # REQUIRED: the public origin objects are served from - the bucket's
      # custom domain, never the S3 endpoint. Unset, uploads still succeed and
      # return URLs that 403 for every browser.
      MEDIA_PUBLIC_BASE_URL: "${MEDIA_PUBLIC_BASE_URL:?MEDIA_PUBLIC_BASE_URL is required - e.g. https://media.example.com}"
      # Optional OTLP exporters; unset disables telemetry export and keeps the
      # runtime's default tracer and logger.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      FEEBLO_TELEMETRY_TRACES_SAMPLE_RATE: ${FEEBLO_TELEMETRY_TRACES_SAMPLE_RATE:-1}
    ports:
      # Only the host side varies. The image pins the container listen
      # port (SERVER_PORT=8080), and the healthcheck and this mapping
      # target that same port, so the target must stay 8080.
      - "${SERVER_PORT:-8080}:8080"

  web:
    container_name: feeblo-web
    image: ghcr.io/g3root/feeblo-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-dev}
        API_URL: ${API_URL:-http://localhost:8080}
        APP_URL: ${APP_URL:-http://localhost:4321}
        APP_ROOT_DOMAIN: ${APP_ROOT_DOMAIN:-localhost}
    restart: always
    depends_on:
      - server
    # Deliberately no `env_file`: the web process only needs public URLs and
    # browser-safe settings. The server container receives the operator file,
    # which carries DATABASE_URL, AUTH_ENCRYPTION_KEY, SMTP_PASSWORD and the
    # object-storage secret; none of those belong in this container.
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      APP_RELEASE: ${APP_RELEASE:-dev}
      # Browser-facing origin, injected into `window.global.__ENV`.
      API_URL: ${API_URL:-http://localhost:8080}
      # Server-side origin for board/feed rendering and the telemetry relay.
      # Inside compose the public API origin may not resolve or route back in,
      # so the web process calls the service directly. Override it when the API
      # runs outside the compose network.
      API_URL_INTERNAL: ${API_URL_INTERNAL:-http://server:8080}
      APP_URL: ${APP_URL:-http://localhost:4321}
      APP_ROOT_DOMAIN: ${APP_ROOT_DOMAIN:-localhost}
      # Deployment label and search-engine switch (staging deployments set
      # NO_INDEX). Both are read per request by the web process.
      APP_ENV: ${APP_ENV:-production}
      NO_INDEX: ${NO_INDEX:-}
      # Browser-safe analytics and error reporting. A Sentry DSN identifies a
      # project; it does not authorize ingestion. Both are injected into the
      # page, so they are public by design.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      DATABUDDY_CLIENT_ID: ${DATABUDDY_CLIENT_ID:-}
      DATABUDDY_API_URL: ${DATABUDDY_API_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      # The web process attaches the page security headers, and its `img-src`
      # allow-list has to name the media origin or every uploaded image is
      # blocked. Optional here because a deployment that has not configured
      # object storage has no uploaded media to render.
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
      # Extra image origins (OAuth/SSO avatars, a custom CDN), comma-separated.
      CONTENT_IMAGE_ORIGINS: ${CONTENT_IMAGE_ORIGINS:-}
    ports:
      # Only the host side varies. The image pins the container listen
      # port (PORT=4321), so the mapping target must stay 4321.
      - "${WEB_PORT:-4321}:4321"
    # The web image has no healthcheck of its own. `/` is the dashboard
    # document: it renders without a session (auth is resolved in the SPA), so
    # a 2xx here means the SSR handler and the static bundle are serving.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4321/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres:
  redis:
