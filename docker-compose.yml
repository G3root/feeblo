services:
  pg:
    image: pgvector/pgvector:pg17
    container_name: feeblo-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feeblo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-feeblo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-feeblo} -d ${POSTGRES_DB:-feeblo}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: feeblo-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    container_name: feeblo-server
    image: ghcr.io/g3root/feeblo-server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-dev}
    restart: always
    # `.env` is the documented place to configure this stack, but Compose only
    # forwards the keys listed under `environment:` below — everything else in
    # that file is used for interpolation and then dropped. That silently
    # excluded SMTP_*, POLAR_*, the GitHub/Slack/Discord credentials,
    # EMBEDDING_*, INTEGRATION_ENCRYPTION_KEY, MEDIA_PUBLIC_BASE_URL and
    # SENTRY_*, so a self-hoster's mail and billing settings never reached the
    # container. `env_file` closes the gap; `environment:` still wins for the
    # keys it lists, which is why DATABASE_URL and REDIS_URL keep pointing at the
    # compose network rather than at whatever `.env` holds.
    #
    # `required: false` because `.env` is optional: a deployment that supplies
    # its configuration through the process environment (as the CI smoke test
    # does) must still start.
    env_file:
      - path: .env
        required: false
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SERVER_PORT: ${SERVER_PORT:-8080}
      APP_RELEASE: ${APP_RELEASE:-dev}
      APP_URL: ${APP_URL:-http://localhost:3001}
      API_URL: ${API_URL:-http://localhost:3000}
      APP_ROOT_DOMAIN: ${APP_ROOT_DOMAIN:-localhost}
      # Browser origins allowed to call the API (better-auth trustedOrigins).
      # Public board subdomains require a wildcard for their root domain.
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-${APP_URL:-http://localhost:3001},${API_URL:-http://localhost:3000},*.${APP_ROOT_DOMAIN:-localhost}}
      DATABASE_URL: ${DATABASE_URL:-postgres://feeblo:password@pg:5432/feeblo}
      # NOTE: the line above interpolates `${DATABASE_URL}` from `.env`, and the
      # value in `.env.example` points at the *dev* stack (127.0.0.1:54323), which
      # is unreachable from inside this container. Unset DATABASE_URL in `.env`
      # to take the `pg:5432` default, or set it to the address the container can
      # actually reach. An external database is configured the same way.
      # REQUIRED: at-rest encryption key for auth and integration secrets.
      # Compose fails fast instead of silently starting with a known key.
      # Generate one with: openssl rand -hex 32
      AUTH_ENCRYPTION_KEY: "${AUTH_ENCRYPTION_KEY:?AUTH_ENCRYPTION_KEY is required - generate one with: openssl rand -hex 32}"
      # Shared rate-limiter store. REQUIRED in production: startup fails
      # without it so rate limits are never silently per-instance.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Optional SES feedback webhook: leave unset to keep the route inert (404).
      EMAIL_PROVIDER_WEBHOOK_TOKEN: ${EMAIL_PROVIDER_WEBHOOK_TOKEN:-}
      EMAIL_PROVIDER_SNS_TOPIC_ARN: ${EMAIL_PROVIDER_SNS_TOPIC_ARN:-}
      MEDIA_UPLOAD_REGION: ${MEDIA_UPLOAD_REGION:-us-east-1}
      MEDIA_UPLOAD_ENDPOINT: ${MEDIA_UPLOAD_ENDPOINT:-http://127.0.0.1:9002}
      MEDIA_UPLOAD_ACCESS_KEY_ID: ${MEDIA_UPLOAD_ACCESS_KEY_ID:-feeblo}
      MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MEDIA_UPLOAD_SECRET_ACCESS_KEY:-password}
      MEDIA_PUBLIC_BUCKET_NAME: ${MEDIA_PUBLIC_BUCKET_NAME:-feeblo-media-public}
    ports:
      - "${SERVER_PORT:-8080}:8080"

  web:
    container_name: feeblo-web
    image: ghcr.io/g3root/feeblo-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-dev}
        API_URL: ${API_URL:-http://localhost:3000}
        APP_URL: ${APP_URL:-http://localhost:3001}
        APP_ROOT_DOMAIN: ${APP_ROOT_DOMAIN:-localhost}
    restart: always
    # The Node entry reads API_URL, APP_URL, APP_ROOT_DOMAIN, APP_RELEASE,
    # TURNSTILE_SITE_KEY, NO_INDEX, POSTHOG_KEY and POSTHOG_HOST from the process
    # environment on every request, so the last four have to arrive from `.env`
    # — `environment:` below does not list them. See the note on the server
    # service for why `required: false`.
    env_file:
      - path: .env
        required: false
    depends_on:
      - server
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${WEB_PORT:-4321}
      API_URL: ${API_URL:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3001}
      APP_ROOT_DOMAIN: ${APP_ROOT_DOMAIN:-localhost}
    ports:
      - "${WEB_PORT:-4321}:4321"

volumes:
  postgres:
  redis:
