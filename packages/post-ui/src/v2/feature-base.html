<div id="fb-messenger-root" class="featurebase-messenger-root">
  <div
    id="featurebase-messenger-container"
    class="featurebase-messenger-container"
  ></div>
  <div
    class="featurebase-notification-frame-wrapper featurebase-notification-frame-wrapper-closed"
    id="featurebase-notification-wrapper"
    style="--fb-element-transform-origin: right bottom; --fb-element-bottom: 68px; --fb-element-right: 4px; --fb-element-left: auto;"
  >
    <iframe
      class="featurebase-notification-frame"
      title="Featurebase Message Notification"
      role="status"
      aria-live="polite"
      scrolling="no"
      src="about:blank"
      style="opacity: 0;"
    ></iframe>
  </div>
  <div
    class="featurebase-banner-frame-wrapper featurebase-banner-frame-wrapper--top featurebase-banner-frame-wrapper-hidden"
    id="featurebase-banner-frame-wrapper"
  >
    <iframe
      class="featurebase-banner-frame"
      title="Featurebase Banner"
      role="status"
      aria-live="polite"
      scrolling="no"
      src="about:blank"
    ></iframe>
  </div>
  <div
    class="featurebase-messenger-launcher-frame-wrapper"
    id="featurebase-messenger-launcher-frame-wrapper"
    style="--fb-element-bottom: 20px; --fb-element-right: 20px; --fb-element-left: auto;"
  >
    <iframe
      class="featurebase-messenger-badge-frame"
      title="Featurebase Messenger Badge"
      allowtransparency="true"
      src="about:blank"
    ></iframe><iframe
      class="featurebase-messenger-launcher-frame"
      title="Featurebase Messenger Launcher"
      role="button"
      aria-label="Open Featurebase Messenger"
      src="about:blank"
    ></iframe>
  </div>
  <div
    id="featurebase-iframe-wrapper"
    class="featurebase-messenger-frame-wrapper featurebase-messenger-frame-wrapper-closed"
    style="--fb-element-transform-origin: right bottom; --fb-element-bottom: 84px; --fb-element-right: 20px; --fb-element-left: auto; box-shadow: rgba(0, 0, 0, 0.25) 0px 5px 42px;"
  >
    <iframe
      allowfullscreen="true"
      name="fb-messenger-frame"
      class="featurebase-messenger-iframe featurebase-messenger-frame"
      title="Featurebase live chat"
      role="dialog"
      sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-downloads allow-presentation allow-modals"
      allow="autoplay *"
      src="about:blank"
    ></iframe>
  </div>
  <div
    class="featurebase-messenger-popup-wrapper featurebase-messenger-popup-wrapper-hidden"
  >
    <iframe
      allowfullscreen="true"
      name="fb-fullscreen-popup-frame"
      class="featurebase-messenger-popup-iframe"
      title="Featurebase fullscreen popup"
      role="dialog"
      src="about:blank"
    ></iframe>
  </div>
</div>
