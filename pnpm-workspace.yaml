  "@better-auth/api-key": 1.7.2
  "@better-auth/utils": ^0.4.0
  "@bufbuild/protobuf": 2.16.0
  "@cloudflare/workers-types": ^4.20260702.1
  "@dotenvx/dotenvx": ^1.75.1
  "@effect-aws/client-s3": 2.0.0-beta.6
  "@effect-aws/s3": 1.0.0-beta.5
  "@effect/ai-openai": 4.0.0
  "@effect/atom-react": 4.0.0
  "@effect/platform-node": 4.0.0
  "@effect/sql-pg": 4.0.0
  "@effect/sql-pglite": 4.0.0
  "@effect/vitest": 4.0.0
  "@floating-ui/dom": ^1.8.0
  "@isaacs/ttlcache": ^2.1.5
  "@polar-sh/better-auth": ^1.8.3
  "@polar-sh/sdk": ^0.47.1
  "@solidjs/router": ^0.16.1
  "@tailwindcss/cli": ^4.1.18
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/query-db-collection": 1.2.15
  "@tanstack/react-db": ^0.4.1
  "@tanstack/react-form": ^1.33.3
  "@tanstack/react-query": ^5.101.0
  "@tanstack/react-router": ^1.170.38
  "@tanstack/react-router-with-db": ^0.1.0
  "@tanstack/react-start": ^1.168.57
  "@tanstack/react-virtual": ^3.13.23
  "@types/node": ^24.12.2
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  "@vitejs/plugin-react": ^6.1.1
  alchemy: ^0.82.1
  better-auth: 1.7.2
  class-variance-authority: ^0.7.1
  cn: ^0.2.4
  dotenv: ^17.2.2
  # `drizzle-kit` stays on rc.4 on purpose. rc.5's kit reads snapshot format 9,
  # and all 45 committed snapshots in `packages/db/src/migrations` are format 8,
  # so rc.5's `generate` refuses to run until `drizzle-kit up` rewrites every
  # one of them. That rewrite touches the migrations directory, so it is its own
  # change; rc.4's kit reads the rc.5 ORM schema and generates a clean, empty
  # diff today, which is verified. Bump this to rc.5 only together with that
  # rewrite, never on its own.
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.5
  drizzle-seed: 1.0.0-rc.5
  effect: 4.0.0
  jose: ^6.2.3
  postgres: ^3.4.7
  rangi: ^2.2.0
  react: ^19.2.8
  react-dom: ^19.2.8
  rolldown: v1.0.0-rc.16
  shadcn: ^3.8.5
  solid-js: ^1.9.14
  tailwindcss: ^4.3.3
  tsx: ^4.20.6
  tw-animate-css: ^1.4.0
  typescript: 7.0.2
  vite: ^8.0.16
  "vite-plugin-icons-spritesheet": ^3.1.0
  vite-plugin-solid: ^2.11.12
  # `@effect/vitest` 4.0.0 peers on vitest >=5.0.0 <6.0.0; keep the
  # two on the same major so the helper package is not running against an
  # unsupported vitest API.
  vitest: ^5.0.2
  zod: ^4.4.3
nodeLinker: hoisted
overrides:
  "@effect/platform-node-shared": 4.0.0
  prosemirror-model: ^1.25.9
patchedDependencies:
  "@effect-aws/s3@1.0.0-beta.5": patches/@effect-aws__s3@1.0.0-beta.5.patch
