packages:
  - apps/*
  - integrations/*
  - packages/*
  - e2e
# A version published less than a day ago is not installed. A compromised
# release is usually yanked within hours, and the lockfile is the only place a
# resolution may change, so the delay costs a deliberate bump nothing and keeps
# `pnpm add` and `pnpm update` from adopting a release nobody has looked at.
minimumReleaseAge: 1440
# Drizzle 1.0.0-rc.5 was published 2026-10-21, less than a day before this
# bump. It is the release that makes the ORM import `effect/sql/SqlError`
# instead of the removed `effect/unstable/sql`, and that is a correctness fix,
# not a preference: the stale path resolved to `any` under `skipLibCheck`, so
# the error half of `db.transaction`'s type was `any` and every transaction in
# the tree silently lost the errors it was supposed to handle. The kit moves
# with it because rc.5's kit peers on the rc.5 ORM and reads snapshot format 9.
# Drop these entries once rc.5 is a day old.
#
# Both are pinned to the version rather than named bare, because a bare name
# exempts every future release of that package — which is the case the setting
# exists to slow down. Verified that pnpm enforces the version half: with a name
# that matches and a version that does not, `pnpm install` fails with
# `ERR_PNPM_NO_MATURE_MATCHING_VERSION` instead of exempting the package.
minimumReleaseAgeExclude:
  - drizzle-kit@1.0.0-rc.5
  - drizzle-orm@1.0.0-rc.5
  # The `better-auth` bump is a security fix, and the age gate is the only
  # thing between it and the install. 1.7.2 is affected by three advisories
  # (GHSA-44jh-23m7-hpcf, GHSA-965c-763c-88jm, GHSA-r4xp-prcw-77qf), all fixed
  # in 1.7.7; 1.7.15 and 1.7.16 clear them, and 1.7.16 also fixes revoked
  # sessions staying usable against the session store. The plugin package peers
  # on the exact `better-auth` patch it ships with (`@better-auth/api-key
  # @1.7.16` peers `better-auth: ^1.7.16`), so the two entries below are the
  # pair that has to be exempt together. Same rule as above: a version, never
  # a bare name, so the exemption stops at the release that was reviewed. Drop
  # both entries once they are a day old.
  - better-auth@1.7.16
  - "@better-auth/api-key@1.7.16"
  # The TanStack DB 1.0 RC. `@tanstack/react-db` and
  # `@tanstack/query-db-collection` are one track: the query adapter peers on
  # `@tanstack/db ^1.0.0-rc.0`, so they move together or the install resolves
  # two copies of the DB core. Same rule as above: a version, never a bare
  # name. Drop these once the RC is a day old.
  - "@tanstack/react-db@1.0.0-rc.1"
  - "@tanstack/query-db-collection@1.5.0"
  # The XState 6 alpha track. `xstate`, `@xstate/effect` and `@xstate/react`
  # publish on one cadence and peer on each other by exact alpha range, so the
  # three land in the same release window and the age gate would otherwise
  # refuse all of them. Same rule as above: a version, never a bare name.
  - "xstate@6.0.0-alpha.73"
  - "@xstate/effect@1.0.0-alpha.12"
  - "@xstate/react@7.0.0-alpha.7"

allowBuilds:
  "@parcel/watcher": true
  # `@sentry/vite-plugin` uploads source maps with the Sentry CLI binary this
  # package's postinstall downloads. A build without SENTRY_AUTH_TOKEN disables
  # the plugin, so the binary is never invoked locally.
  "@sentry/cli": true
  "@swc/core": true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  sharp: true
  workerd: true
catalog:
  "@base-ui/react": ^1.7.0
  "@better-auth/api-key": 1.7.16
  "@better-auth/cimd": 1.7.16
  "@better-auth/mcp": 1.7.16
  "@better-auth/oauth-provider": 1.7.16
  "@bufbuild/protobuf": 2.16.0
  "@cloudflare/workers-types": ^5.20261023.1
  "@dotenvx/dotenvx": ^2.38.2
  "@effect-aws/client-s3": 2.0.0
  "@effect/ai-openai": 4.1.2
  "@effect/atom-react": 4.1.2
  "@effect/platform-node": 4.1.2
  "@effect/sql-pg": 4.1.2
  "@effect/sql-pglite": 4.1.2
  "@effect/vitest": 4.1.2
  # `@effect/sql-pglite` 4.1.2 depends on `@electric-sql/pglite` `^0.5.14`
  # directly, where 4.0.5 took it as a peer. Left at the older spec the
  # workspace resolves 0.5.11 and the driver gets a second, structurally
  # different `PGlite` class from the 0.5.14 copy under `drizzle-orm`, so
  # `drizzle({ client })` stops typechecking even though both are PGlite.
  "@electric-sql/pglite": 0.5.14
  "@floating-ui/dom": ^1.8.0
  "@isaacs/ttlcache": ^2.1.5
  "@polar-sh/better-auth": ^2.1.0
  "@polar-sh/sdk": ^1.0.2
  # Error reporting only. Tracing stays on the Effect OTLP exporters
  # (`docs/telemetry.md`); Sentry is initialized with `tracesSampleRate: 0`,
  # matching `UsefulSoftwareCo/executor`'s split between the two systems.
  "@sentry/node": 10.75.0
  "@sentry/react": 10.75.0
  "@sentry/vite-plugin": 5.4.0
  "@solidjs/router": ^1.0.0
  "@tailwindcss/vite": ^4.3.3
  # The TanStack DB track is pinned to exact versions, not carets: `1.0.0-rc.1`
  # is a release candidate, and a caret would let `1.0.0` and later RCs in
  # without review. `query-db-collection` 1.5.0 peers on the RC core, so the
  # two bump together.
  "@tanstack/query-db-collection": 1.5.0
  "@tanstack/react-db": 1.0.0-rc.1
  "@tanstack/react-form": ^1.33.3
  "@tanstack/react-query": ^5.101.0
  "@tanstack/react-router": ^1.170.46
  "@tanstack/react-start": ^1.169.4
  "@tanstack/react-virtual": ^3.13.23
  "@types/node": ^26.6.5
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  "@vitejs/plugin-react": ^6.1.1
  # XState 6 is still alpha and its dist-tags disagree: `@xstate/effect@alpha`
  # resolves to 0.1.0-alpha.4 (peer `effect ^4.0.0-rc.115`, `xstate
  # ^6.0.0-alpha.61`), while the newest build published under `latest` is
  # 1.0.0-alpha.12 (peer `effect ^4.0.0`, `xstate ^6.0.0-alpha.73`). The three
  # are pinned to exact versions, not `@alpha`, so a later tag move cannot
  # change what the lockfile resolves.
  "@xstate/effect": 1.0.0-alpha.12
  "@xstate/react": 7.0.0-alpha.7
  better-auth: 1.7.16
  class-variance-authority: ^0.7.1
  cn: ^0.5.0
  dotenv: ^18.0.9
  # The ORM and the kit are one version or neither runs: rc.5's kit peers on
  # `drizzle-orm >= 1.0.0-rc.5`, and it reads snapshot format 9 while every
  # earlier kit reads format 8. `drizzle-kit up` rewrote every committed
  # snapshot to 9, and a snapshot generated by an older kit arrives as format 8
  # and has to be converted before the kit will run again — so a downgrade means
  # regenerating the chain.
  drizzle-kit: 1.0.0-rc.5
  drizzle-orm: 1.0.0-rc.5
  effect: 4.1.2
  jose: ^6.2.3
  knip: ^6.42.1
  postgres: ^3.4.7
  posthog-js: ^1.438.19
  rangi: ^2.2.0
  # React 19.3 breaks two comment flows the e2e suite pins: the
  # Comments/Activity tab click stops switching panels and a replied-to thread
  # stays collapsed (`--grep "comment as status update|comment replies"` fails
  # on 19.3.1, passes on 19.2.8). Stay on the 19.2 line until that is
  # diagnosed; 19.3 carries no advisory.
  react: ~19.2.8
  react-dom: ~19.2.8
  rolldown: ^1.2.15
  shadcn: ^4.22.1
  solid-js: ^1.9.17
  tailwindcss: ^4.3.3
  tsrs: 0.20.1-ts7.1.0-beta
  tsx: ^4.20.6
  tw-animate-css: ^1.4.0
  vite: ^8.3.5
  "vite-plugin-icons-spritesheet": ^3.1.0
  vite-plugin-solid: ^2.11.12
  xstate: 6.0.0-alpha.73
  # `@effect/vitest` 4.1.2 peers on vitest >=5.0.0 <6.0.0; keep the
  # two on the same major so the helper package is not running against an
  # unsupported vitest API.
  vitest: ^5.0.2
  zod: ^4.4.3
nodeLinker: hoisted
overrides:
  "@effect/platform-node-shared": 4.1.2
  prosemirror-model: ^1.25.9
