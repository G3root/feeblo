name: CI
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "**/docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "**/docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_app:
    name: Build App
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443 github.com:443 nodejs.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Copy env
        run: cp .env.example .env

      - name: Build app
        run: pnpm run build
        env:
          APP_ROOT_DOMAIN: localhost
          APP_URL: http://localhost:3101
          API_URL: http://localhost:3100
          CLOUDFLARE_ADAPTER: "false"

      - name: Install Playwright browser
        run: pnpm --filter @feeblo/e2e exec playwright install --with-deps chromium

      - name: Run end-to-end tests using built apps
        run: pnpm --filter @feeblo/e2e test:ci
        env:
          # Print web-server startup, health-check, and process-exit details when
          # Playwright fails before a spec can begin.
          DEBUG: pw:webserver

      - name: Upload end-to-end test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: warn
          retention-days: 7

  test:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443 github.com:443 nodejs.org:443 storage.googleapis.com:443 cdn.playwright.dev:443 archive.ubuntu.com:443 security.ubuntu.com:443 ppa.launchpad.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Copy env
        run: cp .env.example .env

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        run: pnpm --filter @feeblo/post-ui exec playwright install --with-deps chromium

      # - name: Typecheck
      #   run: pnpm exec turbo check-types --concurrency=4

      - name: Unit tests
        run: pnpm exec turbo run test --filter=!@feeblo/e2e --concurrency=4

  docker_smoke_test:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          disable-telemetry: true
          allowed-endpoints: api.github.com:443 github.com:443 nodejs.org:443 ghcr.io:443 pkg-containers.githubusercontent.com:443 registry-1.docker.io:443 docker.io:443 auth.docker.io:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Copy env
        run: cp .env.example .env

      - name: Build self-hosted stack
        run: docker compose build server web
        env:
          IMAGE_TAG: test
          APP_RELEASE: ${{ github.sha }}
          APP_URL: http://localhost:3001
          API_URL: http://localhost:3000
          APP_ROOT_DOMAIN: localhost

      - name: Start services
        run: docker compose up -d --wait --wait-timeout 60
        env:
          IMAGE_TAG: test
          APP_RELEASE: ${{ github.sha }}
          DATABASE_URL: postgres://feeblo:password@pg:5432/feeblo
          APP_URL: http://localhost:3001
          API_URL: http://localhost:3000
          APP_ROOT_DOMAIN: localhost
          AUTH_ENCRYPTION_KEY: dev-key

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down --volumes
