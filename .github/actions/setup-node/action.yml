name: Initialize Node.js, pnpm, and dependencies
description: "Sets up a consistent Node.js environment"
inputs:
  cache:
    required: false
    default: "pnpm"
    description: Allow to disable pnpm cache for better security
  install:
    required: false
    default: ""
    description: Allow to disable `pnpm install` call
  registry-url:
    required: false
    default: ""
    description: Optional npm registry URL; enables npm auth via NODE_AUTH_TOKEN
runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: ${{ inputs.cache && 'pnpm' || '' }}
        registry-url: ${{ inputs.registry-url }}

    - name: Install pnpm dependencies
      if: ${{ inputs.install != 'false' }}
      shell: bash
      run: pnpm install ${{ inputs.install }}
